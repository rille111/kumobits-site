<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090713">
  <meta name="description" content="A synthwave endless racer. Hold the slide, release the boost, and chase your best run.">
  <link rel="icon" href="data:,">
  <title>Neon Drift</title>
  <script type="module" crossorigin src="./assets/index-DOkd2_UY.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-core-bPI3gPZ7.js">
  <link rel="modulepreload" crossorigin href="./assets/three-renderer-D_WcrXaz.js">
  <link rel="stylesheet" crossorigin href="./assets/index-Cbun41Vl.css">
</head>
<body>
  <canvas id="road" aria-label="Neon highway"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <main id="game" data-state="title">
    <header class="topbar">
      <div class="brand"><i aria-hidden="true"></i> NEON<span>DRIFT</span></div>
      <div class="toolbar">
        <button id="sound" class="icon-button" type="button" aria-label="Sound" aria-pressed="true" hidden>Sound on</button>
        <button id="pause" class="icon-button" type="button" hidden aria-label="Pause race">Ⅱ</button>
      </div>
    </header>
    <section id="screen" class="screen" aria-label="Race menu"></section>
    <section id="hud" class="hud" aria-label="Race telemetry" hidden>
      <div class="hud-speed"><strong id="speed">000</strong><span>KM/H</span></div>
      <div class="hud-score"><span>SCORE</span><strong id="score">000000</strong><b id="multiplier">×1</b></div>
      <div class="hud-drift">
        <div class="meter-label"><span id="boost-label">DRIFT CHARGE</span><span id="distance">0.00 KM</span></div>
        <meter id="boost" min="0" max="1" value="0" aria-label="Drift charge"></meter>
        <div id="event" class="race-event" role="status"></div>
      </div>
    </section>
    <div id="touch" class="touch" aria-label="Touch driving controls" hidden>
      <div class="touch-group">
        <button data-drive="left" aria-label="Steer left">◀</button>
        <button data-drive="right" aria-label="Steer right">▶</button>
      </div>
      <div class="touch-group">
        <button data-drive="brake">Brake</button>
        <button data-drive="drift">Drift</button>
      </div>
    </div>
  </main>
</body>
</html>
